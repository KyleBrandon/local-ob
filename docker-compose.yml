name: ob-local

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: openbrain
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openbrain"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ob-mcp:
    build: .
    command: ["-http", ":8080"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/openbrain
      EMBED_PROVIDER:    ${EMBED_PROVIDER}
      EMBED_MODEL:       ${EMBED_MODEL}
      EMBED_DIMENSION:   ${EMBED_DIMENSION}
      EMBED_BASE_URL:    ${EMBED_BASE_URL}
      EMBED_API_KEY:     ${EMBED_API_KEY}
      CLASSIFY_PROVIDER: ${CLASSIFY_PROVIDER}
      CLASSIFY_MODEL:    ${CLASSIFY_MODEL}
      CLASSIFY_BASE_URL: ${CLASSIFY_BASE_URL}
      CLASSIFY_API_KEY:  ${CLASSIFY_API_KEY}
      FORCE_PROVIDER_CHANGE: ${FORCE_PROVIDER_CHANGE:-false}
      TLS_CERT_FILE:     ${TLS_CERT_FILE:-}
      TLS_KEY_FILE:      ${TLS_KEY_FILE:-}
    volumes:
      - ./certs:/certs:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/ob-mcp", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
